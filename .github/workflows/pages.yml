name: Deploy baderomsguide til GitHub Pages

on:
  push:
    branches:
      - main
      - claude/bathroom-flooring-guide-nh538p
    paths:
      - "bathroom-guide/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp bathroom-guide som Pages-artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: bathroom-guide

      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
